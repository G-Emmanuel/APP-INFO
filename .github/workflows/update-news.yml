name: Mise à jour des actus

on:
  schedule:
    - cron: "*/30 * * * *"   # toutes les 30 minutes (GitHub peut décaler de quelques minutes)
  workflow_dispatch:          # bouton « Run workflow » pour lancer à la main
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - id: pages
        uses: actions/configure-pages@v5

      - name: Récupérer les actus déjà publiées (pour garder 7 jours d'historique)
        run: curl -sf "${{ steps.pages.outputs.base_url }}/data/news.json" -o docs/data/news.json || echo "Pas encore de données publiées"

      - name: Collecter les flux
        run: python scripts/fetch_news.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v4

      # GitHub met en pause les tâches planifiées d'un dépôt public sans activité depuis 60 jours.
      # Ce petit commit mensuel l'en empêche.
      - name: Garder le robot actif
        run: |
          last=$(git log -1 --format=%ct)
          if [ "$last" -lt "$(( $(date +%s) - 40*86400 ))" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive
            git add .github/keepalive
            git commit -m "Garder le robot de mise à jour actif"
            git push
          fi
